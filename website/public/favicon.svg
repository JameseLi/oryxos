<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <desc>OryxOS logo：蓝紫渐变圆角徽章上的白色剑羚（oryx）侧面头部剪影，长直双角向后上方伸展，是剑羚的标志性特征。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="216" height="216" rx="52" fill="url(#bg)"/>

  <!-- 远侧角（浅色营造纵深） -->
  <line x1="149" y1="112" x2="191" y2="29" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <!-- 近侧角：长而直，向后上方，根部没入头顶 -->
  <line x1="135" y1="110" x2="181" y2="23" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- 头颈侧面剪影（几何风格，面向左） -->
  <path d="M70,138 L92,122 L126,102 L142,108 L150,118 L154,140 L170,202 L126,202 L114,166 L96,156 L80,148 Z"
        fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

  <!-- 眼（负形，透出徽章底色） -->
  <circle cx="110" cy="126" r="4.2" fill="#6366F1"/>
</svg>
