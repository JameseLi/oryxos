name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:00（北京时间）跑依赖 CVE 扫描
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 主门禁：spotless → checkstyle(观察) → PMD(P3C) → SpotBugs → 单测，任一不过即红
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn -B clean verify

  # OWASP Dependency-Check：首次需下载 NVD 全量库（分钟级），不放日常 PR 门禁；
  # weekly + 手动触发，建议在仓库 Secrets 配置 NVD_API_KEY 避免限流。
  dependency-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: .depcheck-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${NVD_API_KEY:-}" ]; then ARGS="-Dnvd.api.key=$NVD_API_KEY"; fi
          mvn -B verify -Psecurity -DskipTests $ARGS
