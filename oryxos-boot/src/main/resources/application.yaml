spring:
  application:
    name: oryxos
  main:
    # 控制台应用：spring-ai starter 会带入 webflux，但核心阶段 CLI 不启动 Web 容器
    # （US-5 Web Service 特性开启时改为 servlet/reactive）
    web-application-type: none
  datasource:
    url: "jdbc:sqlite:${oryxos.storage.db-path:.oryxos/oryxos.db}"
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      # 宪法工程约束：表结构以 scripts/sql/001-init.sql 手写脚本为准，不依赖自动迁移
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:scripts/sql/001-init.sql

  # Java 21 virtual thread（技术方案决策三/决策五：同步阻塞 + virtual thread 撑高并发）
  threads:
    virtual:
      enabled: true

server:
  port: 8080

logging:
  level:
    root: info

# ---------------------------------------------------------------------------
# 可观测性（oryxos-init skill 步骤 4）：health/info/prometheus/metrics
# 核心阶段最小集，认证/限流不做（宪法第二条，内网假设）
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: oryxos

# ---------------------------------------------------------------------------
# OryxOS 配置（contracts/cli-contract.md）
# 密钥一律走环境变量（api-key-env 只存变量名，禁止明文写密钥——宪法工程约束）
# ---------------------------------------------------------------------------
oryxos:
  workspace-dir: .oryxos
  react:
    max-iterations: 10            # ReAct 迭代上限（FR-007；AGENT.md max_iterations 可覆盖）
    invocation-timeout-seconds: 60  # 单次 Agent 调用整体超时（FR-010）
  storage:
    db-path: .oryxos/oryxos.db
  sandbox:
    # http_get 域名白名单（WhitelistSandbox；支持后缀匹配）
    allowed-domains:
      - wttr.in
  tools:
    http-timeout-seconds: 10      # 工具 HTTP 请求超时（超时按工具失败处理，走失败回填路径）
  providers:
    deepseek:
      type: deepseek
      model: deepseek-chat
      # 只存环境变量名！密钥本体禁止进 yaml/git（宪法工程约束，AGENTS.md §5 高发错误清单）
      api-key-env: DEEPSEEK_API_KEY
    # 第二家示例（US3 切换验收用，contracts/cli-contract.md）：
    # qwen:
    #   type: dashscope
    #   model: qwen-plus
    #   api-key-env: AI_DASHSCOPE_API_KEY
    # OpenAI 兼容型示例（Kimi/智谱/混元/豆包等）：
    # kimi:
    #   type: openai-compatible
    #   model: moonshot-v1-8k
    #   base-url: https://api.moonshot.cn/v1
    #   api-key-env: MOONSHOT_API_KEY

---
# ---------------------------------------------------------------------------
# 「web」profile：启动内嵌 Web 容器（Spring MVC + 虚拟线程），暴露
# /actuator/* 与 /swagger-ui.html。默认 none 不起容器——核心阶段 CLI 场景
# 不拉 Web；US-5 Web Service 及监控验证走：--spring.profiles.active=web
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: web
  main:
    web-application-type: servlet
