spring:
  application:
    name: oryxos
  main:
    # 控制台应用：核心阶段 CLI 默认不起 Web 容器（Web Service 特性开启 servlet）
    web-application-type: none
  datasource:
    url: "jdbc:sqlite:${oryxos.storage.db-path:.oryxos/oryxos.db}"
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      # 宪法工程约束：表结构以 scripts/sql 手写脚本为准，不依赖自动迁移
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  sql:
    init:
      # 启动时执行手工建表脚本（scripts/sql/001-init.sql，仅 llm_calls）。 lxml：
      # always=每次启动都执行；脚本全是 CREATE ... IF NOT EXISTS，重复执行幂等不伤数据。
      mode: always
      schema-locations: classpath:scripts/sql/001-init.sql

  # Java 21 virtual thread（技术方案决策三/决策五：同步阻塞 + virtual thread 撑高并发）
  threads:
    virtual:
      enabled: true

server:
  port: 8080

logging:
  level:
    root: info

# ---------------------------------------------------------------------------
# 可观测性（oryxos-init skill）：health/info/prometheus/metrics
# 核心阶段最小集，认证/限流不做（宪法第二条，内网假设）
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: oryxos

# ---------------------------------------------------------------------------
# OryxOS 工作区与存储。
# 注意：第 16 节仅交付 Provider 抽象 + llm_calls 表，以下其它配置块
# （providers 全局层、react、sandbox、tools 等）由后续各节课件按需补齐，
# 本文件不为未交付的能力预先声明配置。
# ---------------------------------------------------------------------------
oryxos:
  workspace-dir: .oryxos
  storage:
    db-path: .oryxos/oryxos.db
  # 课件「第一步」Provider 全局层（list 形态）：声明本实例接了哪些 provider、凭证从哪个环境变量读。
  # 密钥走 ${ENV_VAR} 占位——代码与配置文件里不出现真 key（宪法工程约束）。
  # 想接哪家先 `mvn dependency:tree` 确认 connector 能下载、能解析，再当作示例启用（课件「坑三」）。
  providers:
    - name: deepseek
      type: deepseek
      model: deepseek-chat
      api-key: ${DEEPSEEK_API_KEY}
    # 第二家示例（Kimi / 智谱 / 混元 / 豆包等 OpenAI 兼容）：
    # - name: kimi
    #   type: openai-compatible
    #   model: moonshot-v1-8k
    #   base-url: https://api.moonshot.cn/v1
    #   api-key: ${KIMI_API_KEY}
    # 通义千问（dashscope）示例：
    # - name: qwen
    #   type: dashscope
    #   model: qwen-plus
    #   api-key: ${AI_DASHSCOPE_API_KEY}

---
# ---------------------------------------------------------------------------
# 「web」profile：启动内嵌 Web 容器（Spring MVC + 虚拟线程），暴露
# /actuator/*。默认 none 不起容器——Web Service 走：--spring.profiles.active=web
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: web
  main:
    web-application-type: servlet